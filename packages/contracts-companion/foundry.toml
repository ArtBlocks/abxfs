[profile.default]
src = "src"
out = "out"
libs = ["lib", "../protobuf-sol", "../contracts-core"]
# Remappings come only from remappings.txt. Auto-detection would add absolute paths of the checkout, and the
# remappings are part of the solc metadata the bytecode commits to, so addresses would depend on where the repo lives.
auto_detect_remappings = false
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
# Stays false: IpfsCidResolver releases its memory arenas by putting the free memory pointer back, which is sound only
# under the legacy code generator (it never moves stack variables to memory). It is also part of the resolver's address.
via_ir = false
verbosity = 2
fuzz = { runs = 256 }
fs_permissions = [
  { access = "read", path = "../contracts-core/out" },
  { access = "read", path = "../protobuf-sol/test/fixtures" },
  { access = "read", path = "./test/fixtures" },
]

# Branch coverage (`forge coverage` builds without the optimizer, so the pin tests and the gas bounds fail there and are
# excluded):
#   forge coverage --report summary --no-match-test "Pinned|test_runOnAProductionChainIdWithThePinnedBuild|test_5300ShortNamesRefuseBeforeAnyChild"

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 3

[fmt]
# Never format the libraries: their source text is part of every deployed address (scripts/install-forge-deps.sh).
ignore = ["lib/**"]
