# Aderyn settings for the content contracts. Run `aderyn .` from this directory.
#
# Aderyn can only skip a detector for the whole package, not one finding, so only style detectors and detectors
# about the pinned build settings are skipped. Everything else reports, including findings already reviewed;
# their reasons are listed at the end of this file. Slither skips reviewed findings one by one instead, from
# slither.db.json.
version = 1
root = "."
src = "src"

[detectors]
exclude = [
  # Style.
  "literal-instead-of-constant",
  "internal-function-used-once",
  # Node validation reverts on the first bad entry on purpose.
  "require-revert-in-loop",
  # foundry.toml pins solc 0.8.24 and EVM Cancun for every contract, and every supported network supports PUSH0.
  "push-zero-opcode",
  "unspecific-solidity-pragma",
]

# Reviewed findings that still report, and why none applies:
#
# - contract-locks-ether (ChunkStore, FileStore, DirectoryStore): Solady Multicallable's multicall is payable but
#   reverts on a non-zero msg.value, and no other function, receive or fallback accepts ETH. ChunkStore.t.sol
#   test_noEth.
# - incorrect-shift-order (NameOps.hasSeparator): Yul shl(shift, value) takes the shift amount first, so the mask
#   keeps the first `rem` bytes as intended. NameOps.t.sol, NameOpsTail.t.sol and the golden vectors.
# - reentrancy-state-change (ChunkStore.write): write calls the backend the writer chose. The id commits to that
#   backend's address, so a re-entering backend can only create records under its own address; a record set
#   during the call stands, and a readable backend's result is checked before the record is written. Covered by
#   the re-entrant backend mock.
# - unsafe-casting (NodeTree): uint32(running) and uint48(runningBytes) are cast only after each total has been
#   matched against its 4-byte count and 6-byte byte field.
# - empty-block (NodeTree._checkBoundary): a virtual hook; DirectoryStore overrides it to enforce entry order and
#   FileStore needs none.
# - unchecked-return (DirectoryStore.resolvePath): _root(rootCid) is called only for its revert when the root does
#   not exist.
# - uninitialized-local-variable (DirectoryStore.resolvePath): the depth counter starts at zero on purpose.
# - unused-error (IStorageBackend.NotEvmReadable): for backends to revert with from retrieve(); ChunkStore never
#   raises it.
