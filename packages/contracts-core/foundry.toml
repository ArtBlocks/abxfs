[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Remappings come only from remappings.txt. Auto-detection would add absolute paths of the checkout, and the
# remappings are part of the solc metadata the bytecode commits to, so addresses would depend on where the repo lives.
auto_detect_remappings = false
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
verbosity = 2
fuzz = { runs = 256 }
fs_permissions = [{ access = "read", path = "./" }]

# Branch coverage (`forge coverage` builds without the optimizer, so every test that pins an address or creation code
# fails there and is excluded):
#   forge coverage --report summary --no-match-test "Pinned|test_metadataTrailer|test_artifactsMatchTheBuild|test_predictedEqualsPinnedFieldByField|test_runRefusesADriftedBuildOffLocal|test_eachDriftIsRefusedByName|test_runOnAProductionChainIdWithThePinnedBuild"

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 3

[fmt]
# Never format the libraries: their source text is part of every deployed address (scripts/install-forge-deps.sh).
ignore = ["lib/**"]
