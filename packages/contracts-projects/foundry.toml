[profile.default]
src = "src"
out = "out"
libs = ["lib", "../contracts-core"]
# Remappings come only from remappings.txt. Auto-detection would add absolute paths of the checkout, and the
# remappings are part of the solc metadata the bytecode commits to, so addresses would depend on where the repo lives.
auto_detect_remappings = false
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
verbosity = 2
fuzz = { runs = 256 }
fs_permissions = [{ access = "read-write", path = "./out" }, { access = "read", path = "../contracts-core/out" }, { access = "read", path = "../contracts-companion/out" }]

# Branch coverage (`forge coverage` builds without the optimizer, so the pin tests, the initcode-size tests and the gas
# bounds fail there and are excluded):
#   forge coverage --report summary --no-match-test "Pinned|test_predictedAddresses|test_storeAllowTable|test_metadataTrailer|test_factoryInitcodeFitsTheDeployLimit|test_initcodeHeadroomNumbers" --no-match-contract "GasClaimsTest|DeployGasTest"

[profile.ci]
fuzz = { runs = 1_000 }
verbosity = 3

[fmt]
# Never format the libraries: their source text is part of every deployed address (scripts/install-forge-deps.sh).
ignore = ["lib/**"]
