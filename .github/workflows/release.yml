name: release

# Publishes the @artblocks/abxfs-* packages through Changesets and npm trusted publishing (OIDC): no npm token is
# stored anywhere. Each package names this repository and this workflow file as its trusted publisher on npmjs.com, so
# renaming this file stops every release until each package is told the new name.
#
# Every push to main either opens (or updates) the Version Packages pull request, when changesets are waiting, or
# publishes whatever version on main is not on npm yet. Nothing is tested here: main only takes a pull request whose
# required checks passed, and the tarballs are the ones sdk-ci's pack smoke test installs.
#
# OIDC needs Node >= 22.14 and pnpm pinned in package.json, and no `registry-url` on setup-node: the .npmrc it writes
# gets in the way of the token exchange.
on:
  push:
    branches: [main]

# Never two releases at once: a second push waits rather than racing a publish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # the Version Packages branch, and the release tags
  pull-requests: write # open or update the Version Packages pull request
  id-token: write # the OIDC token npm trades for a short-lived publish token
  actions: write # start the required checks on the Version Packages branch (below)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Changesets diffs against main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages read each other from dist, and none of them builds on pack.
      - name: Build packages
        run: pnpm -r --filter="./packages/*" build
      - name: Open the Version Packages pull request, or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:publish
          commit-message: Version packages
          pr-title: Version packages
      # A pull request opened with this workflow's token starts no workflow, so its required checks would never
      # report. Start them on the release branch: their check runs land on the commit the pull request shows.
      - name: Run the required checks on the Version Packages pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in repo-ci.yml contracts-ci.yml sdk-ci.yml; do
            gh workflow run "$workflow" --ref changeset-release/main
          done
