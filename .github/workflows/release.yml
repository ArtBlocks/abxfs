name: release

on:
  workflow_dispatch:

# Builds, tests and packs every package, and uploads the tarballs as artifacts. It publishes nothing:
# publishing will go through npm trusted publishing (OIDC, no stored token), set up with the first release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # `pnpm run test` runs forge (the contracts, and `abi-drift.test.ts`'s `forge inspect`): the same pin and
      # dependencies as contracts-ci and sdk-ci.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.4.3
      - run: pnpm install --frozen-lockfile
      - name: Install forge dependencies
        run: ./scripts/install-forge-deps.sh
      - name: Build contracts (needed for SDK ABIs)
        run: |
          (cd packages/protobuf-sol && forge build)
          (cd packages/contracts-core && forge build)
          (cd packages/contracts-companion && forge build)
          (cd packages/contracts-projects && forge build)
      # There is no root `build` script: every workspace package, as sdk-ci builds them.
      - name: Build packages
        run: pnpm -r --filter="./packages/*" build
      - run: pnpm run test
      - name: Pack and install smoke test
        run: ./scripts/pack-smoke.sh
      - name: Pack
        run: |
          mkdir -p dist-tarballs
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarballs
          path: dist-tarballs/*.tgz
