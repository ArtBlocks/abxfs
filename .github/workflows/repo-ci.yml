name: repo-ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts it on the Version Packages branch: a pull request opened with a workflow token starts
  # no workflow by itself (see .changeset/README.md).
  workflow_dispatch:

# A newer push to a pull request cancels the run it supersedes; every push to main runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Node built-ins and git only: no install. What it refuses, and why, is at the top of the script.
      - run: node scripts/check-repo-hygiene.mjs
      - run: node --test scripts/verification-plan.test.mjs
