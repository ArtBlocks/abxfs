version: 2

updates:
  # One workspace, one lockfile: minor and patch updates arrive grouped, majors one at a time.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the native compiler and no longer ships `typescript/lib/typescript.js`, the JavaScript API two
      # tests use (one transpiles a source file, one stores the compiler as a large real file). Revisit when they move.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      # `@fumadocs/base-ui` requires the exact `fumadocs-core` it was released with, so they move together, majors too.
      fumadocs:
        patterns:
          - "fumadocs-*"
          - "@fumadocs/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Every action is pinned to a commit SHA (the repository requires it); this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
